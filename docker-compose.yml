name: ${COMPOSE_PROJECT_NAME:-alea}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: "${LOG_MAX_FILES:-5}"

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Define DATABASE_NAME in the server env file}
      POSTGRES_USER: ${DATABASE_USER:?Define DATABASE_USER in the server env file}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in the server env file}
      TZ: ${TZ:-America/Mexico_City}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        case "$${POSTGRES_PASSWORD}" in
          CAMBIAR_*|cambiar_*|CHANGE_THIS*|change_this*|app123|postgres)
            echo "DATABASE_PASSWORD conserva un valor inseguro o de ejemplo." >&2
            exit 1
            ;;
        esac
        if [ "$${#POSTGRES_PASSWORD}" -lt 16 ]; then
          echo "DATABASE_PASSWORD debe tener al menos 16 caracteres." >&2
          exit 1
        fi
        exec docker-entrypoint.sh postgres
    volumes:
      - type: bind
        source: ${ALEA_ROOT:-/docker/alea}/database/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LISTEN_HOST: 0.0.0.0
      PORT: 3001
      API_BASE_PATH: ${API_BASE_PATH:-/api}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:?Define PUBLIC_FRONTEND_URL in the server env file}
      CORS_ORIGINS: ${CORS_ORIGINS:?Define CORS_ORIGINS in the server env file}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_NAME: ${COOKIE_NAME:-alea_refresh_token}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DATABASE_USER:?Define DATABASE_USER in the server env file}
      DB_PASSWORD: ${DATABASE_PASSWORD:?Define DATABASE_PASSWORD in the server env file}
      DB_NAME: ${DATABASE_NAME:?Define DATABASE_NAME in the server env file}
      DB_RUN_MIGRATIONS: ${DB_RUN_MIGRATIONS:-true}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET in the server env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET in the server env file}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REQUIRED: ${MAIL_REQUIRED:-false}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-10000}
      MAIL_GREETING_TIMEOUT_MS: ${MAIL_GREETING_TIMEOUT_MS:-10000}
      MAIL_SOCKET_TIMEOUT_MS: ${MAIL_SOCKET_TIMEOUT_MS:-20000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_FULLNAME: ${SEED_ADMIN_FULLNAME:-Administrador Inicial}
      SEED_ADMIN_INSTITUTION: ${SEED_ADMIN_INSTITUTION:-}
      SEED_ADMIN_INSTITUTION_ACRONYM: ${SEED_ADMIN_INSTITUTION_ACRONYM:-}
      SEED_ADMIN_POSITION: ${SEED_ADMIN_POSITION:-}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - ${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3001}:3001
    networks:
      - data
      - edge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:'+(process.env.PORT||3001)+'/health')
          .then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      BASE_PATH: ${BASE_PATH:-}
      API_BASE_PATH: ${API_BASE_PATH:-/api}
      API_BASE_URL: ${API_BASE_URL:-${PUBLIC_BACKEND_URL:-}}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3001}
      TZ: ${TZ:-America/Mexico_City}
    ports:
      - ${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:8080
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/_alea_health || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging

networks:
  data:
    internal: true
  edge:
    driver: bridge
